name: waaat-pos
services:
  db:
    image: postgres:16.13-bookworm
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: waaat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run Start-WAAAT.bat first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d waaat']
      interval: 5s
      timeout: 5s
      retries: 20
  init:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: initializer
    command: ['node', '--import', 'tsx', 'scripts/local-init.ts']
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/waaat
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Run Start-WAAAT.bat first}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Run Start-WAAAT.bat first}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Run Start-WAAAT.bat first}
    depends_on:
      db:
        condition: service_healthy
  waaat-pos:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://waaat_app:${APP_DATABASE_PASSWORD}@db:5432/waaat
      COOKIE_SECURE: 'false'
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  postgres_data:
